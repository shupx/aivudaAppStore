<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aivuda Sample Built-in UI</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 24px;
      display: grid;
      gap: 12px;
      background: #0b1020;
      color: #dbeafe;
    }

    .card {
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      background: #111827;
      max-width: 720px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    p {
      margin: 0;
      line-height: 1.6;
    }

    code {
      background: #1e293b;
      border-radius: 6px;
      padding: 2px 6px;
    }
  </style>
</head>
<body>
  <section class="card">
    <h1>Hello from app built-in UI</h1>
    <p>This page is loaded from app package via <code>ui_index_path: ui/index.html</code>.</p>
    <p>It can be opened in AivudaOS card action and rendered inside an iframe.</p>
  </section>
</body>
</html>
